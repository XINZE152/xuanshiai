name: Backend message and media core CI

on:
  push:
  pull_request:

jobs:
  unit:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      ENVIRONMENT: testing
      AUTO_INIT_DB: "false"
      # 不配置数据库服务/凭据；即使测试意外请求会话也不能写真实库。
      DATABASE_URL: mysql+aiomysql://ci:ci@127.0.0.1:1/ci_unreachable
      COMMUNITY_TEST_DATABASE_URL: ""
      AI_TEST_DATABASE_URL: ""
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Install backend and dev dependencies
        run: uv sync --locked --extra dev
      # 全仓 Ruff 存量告警另行收敛；本门禁不跳过这些规则，只限定本阶段改动域。
      - name: Ruff (message and media scope)
        run: uv run --no-sync ruff check app/api/routes/social.py app/api/routes/discovery.py app/services/social.py app/services/media.py app/services/member_follow_up_admin.py scripts/reproduce_upload_exposure.py tests/test_social_features.py tests/test_social_message_idempotency.py tests/test_discovery_features.py tests/test_member_follow_up_media.py
      - name: Message and media unit contracts (no integration/live/manual)
        env:
          UPLOAD_DIR: ${{ runner.temp }}/xuanshiai-uploads
        run: uv run --no-sync pytest tests/test_social_features.py tests/test_social_message_idempotency.py tests/test_discovery_features.py tests/test_member_follow_up_media.py -q

  ai-unit:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      ENVIRONMENT: testing
      AUTO_INIT_DB: "false"
      DATABASE_URL: mysql+aiomysql://ci:ci@127.0.0.1:1/ci_unreachable
      REDIS_URL: redis://127.0.0.1:1/5
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Install backend and dev dependencies
        run: uv sync --locked --extra dev
      - name: Ruff (AI and voice scope)
        run: >-
          uv run --no-sync ruff check
          app/api/routes/ai_compatibility.py app/api/routes/voice.py
          app/api/routes/voice_moxiang.py app/api/routes/voice_ws.py
          app/core/config.py app/core/security.py app/main.py
          app/services/ai/providers.py app/services/voice/auth.py
          app/services/voice/audio_access.py app/services/voice/gateway.py
          app/services/voice/providers.py app/services/voice/realtime/context.py
          app/services/voice/realtime/moxiang_bridge.py
          tests/test_ai_api_contracts.py tests/test_ai_config_hardening.py
          tests/test_ai_schema_and_provider.py tests/test_ai_voice_audio_access.py
          tests/test_voice_auth.py tests/test_voice_cleanup.py
          tests/test_voice_providers_aliyun.py tests/test_voice_ws.py
      - name: AI and voice unit contracts
        env:
          UPLOAD_DIR: ${{ runner.temp }}/xuanshiai-ai-uploads
        run: >-
          uv run --no-sync pytest
          tests/test_ai_schema_and_provider.py
          tests/test_ai_api_contracts.py
          tests/test_ai_config_hardening.py
          tests/test_ai_voice_audio_access.py
          tests/test_voice_auth.py
          tests/test_voice_ws.py
          tests/test_voice_providers_aliyun.py
          tests/test_voice_cleanup.py -q

  # 审计整改（脱敏 / 数据范围 / 事务 / 报名软删除）：全部为不依赖 DB 的单元契约。
  admin-scope-unit:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      ENVIRONMENT: testing
      AUTO_INIT_DB: "false"
      DATABASE_URL: mysql+aiomysql://ci:ci@127.0.0.1:1/ci_unreachable
      REDIS_URL: redis://127.0.0.1:1/5
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Install backend and dev dependencies
        run: uv sync --locked --extra dev
      - name: Ruff (admin scope, redaction and signup soft delete scope)
        run: >-
          uv run --no-sync ruff check
          app/api/routes/activity_admin.py app/api/routes/customer_leads_admin.py
          app/api/routes/matchmaker_crm_admin.py app/api/routes/matchmaker_member_admin.py
          app/core/sensitive_fields.py app/services/community.py
          app/services/customer_lead_admin.py app/services/finance.py
          app/services/idempotency.py app/services/matchmaker_member_admin.py
          app/services/message_admin.py
          tests/test_activity_signup_soft_delete.py tests/test_admin_data_scope_d4.py
          tests/test_certification_material_scope.py tests/test_crm_reassign_org_ownership.py
          tests/test_finance_commission_anchor.py tests/test_matchmaker_crm_data_scope.py
          tests/test_member_admin_scope_params.py tests/test_message_admin_redaction.py
          tests/test_sensitive_operations.py tests/test_wechat_field_redaction.py
      - name: Admin scope, redaction and soft delete contracts
        env:
          UPLOAD_DIR: ${{ runner.temp }}/xuanshiai-admin-uploads
        run: >-
          uv run --no-sync pytest
          tests/test_message_admin_redaction.py
          tests/test_wechat_field_redaction.py
          tests/test_sensitive_operations.py
          tests/test_member_admin_scope_params.py
          tests/test_admin_data_scope_d4.py
          tests/test_certification_material_scope.py
          tests/test_crm_reassign_org_ownership.py
          tests/test_finance_commission_anchor.py
          tests/test_activity_signup_soft_delete.py
          tests/test_matchmaker_crm_data_scope.py -q

  # 画像会话契约（master 活动槽抢占与复用、会话状态终态守卫、journey/start 响应
  # 字段）：全部为不依赖 DB 的内存假库单元契约。test_master_session.py 与
  # test_ai_profile_sessions.py 此前未被任何 job 执行，属既有缺口，一并补上。
  ai-profile-session-unit:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      ENVIRONMENT: testing
      AUTO_INIT_DB: "false"
      DATABASE_URL: mysql+aiomysql://ci:ci@127.0.0.1:1/ci_unreachable
      REDIS_URL: redis://127.0.0.1:1/5
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Install backend and dev dependencies
        run: uv sync --locked --extra dev
      - name: Ruff (profile session and moxiang journey scope)
        run: >-
          uv run --no-sync ruff check
          app/api/routes/ai_moxiang.py app/services/ai/profile.py
          tests/test_ai_profile_sessions.py tests/test_master_session.py
          tests/test_moxiang_journey_start_contract.py
      - name: Profile session and moxiang journey contracts
        env:
          UPLOAD_DIR: ${{ runner.temp }}/xuanshiai-ai-session-uploads
        run: >-
          uv run --no-sync pytest
          tests/test_master_session.py
          tests/test_moxiang_journey_start_contract.py
          tests/test_ai_profile_sessions.py
          tests/test_ai_profile_publish.py
          tests/test_ai_profile_entries.py -q
